<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=block" rel="stylesheet" />
<link rel="stylesheet" href="athena-base.css" />
<style>
  body {
    background: linear-gradient(180deg, #10141f 0%, #0b0e17 100%);
    color: #f3ede3;
  }
  .corner { color: rgba(243, 237, 227, 0.35); }
  .kicker { color: #d9c48a; }
  h1 { font-size: 76px; }
  h1 .thin { font-weight: 340; color: rgba(243, 237, 227, 0.75); }
  .tagline { color: rgba(243, 237, 227, 0.70); font-size: 32px; }
  .chips { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px;
    letter-spacing: 0.04em;
    padding: 8px 16px;
    border: 1.5px solid rgba(243, 237, 227, 0.28);
    color: rgba(243, 237, 227, 0.80);
  }
  .bottom { color: rgba(243, 237, 227, 0.55); }
  .rule { background: rgba(243, 237, 227, 0.18); }
</style>
</head>
<body>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="top">
    <div class="kicker">LuckeySystems Solutions</div>
  </div>

  <div class="mid">
    <h1>El taller,<br /><span class="thin">a tu servicio.</span></h1>
    <div class="chips">
      <span class="chip">Webs que atraen clientes</span>
      <span class="chip">Presencia en Google</span>
      <span class="chip">Herramientas a medida</span>
    </div>
  </div>

  <div class="bottom">
    <span>SOLUTIONS.LUCKEYSYSTEMS.COM</span>
    <span class="rule"></span>
    <span>PRESUPUESTO CERRADO</span>
  </div>
</body>
</html>
