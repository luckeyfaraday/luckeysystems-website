<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=block" rel="stylesheet" />
<link rel="stylesheet" href="athena-base.css" />
<style>
  body {
    background: linear-gradient(180deg, #0f1c16 0%, #0b1611 100%);
    color: #f3ede3;
  }
  .corner { color: rgba(243, 237, 227, 0.35); }
  .kicker { color: #d9c48a; }
  .tagline { color: rgba(243, 237, 227, 0.70); }
  .bottom { color: rgba(243, 237, 227, 0.55); }
  .rule { background: rgba(243, 237, 227, 0.18); }
  h1 .thin { font-weight: 340; color: rgba(243, 237, 227, 0.75); }
  .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 20px;
    letter-spacing: 0.06em;
    padding: 9px 18px;
    border: 1.5px solid rgba(243, 237, 227, 0.28);
    color: rgba(243, 237, 227, 0.80);
  }
</style>
</head>
<body>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="top">
    <svg width="104" height="104" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#f3ede3" stroke-width="28" stroke-linecap="round">
        <line x1="110" y1="76" x2="110" y2="24"/>
        <line x1="110" y1="144" x2="110" y2="196"/>
        <line x1="139.4" y1="93" x2="184.5" y2="67"/>
        <line x1="139.4" y1="127" x2="184.5" y2="153"/>
        <line x1="80.6" y1="93" x2="35.5" y2="67"/>
        <line x1="80.6" y1="127" x2="35.5" y2="153"/>
      </g>
    </svg>
    <div class="kicker">LuckeySystems</div>
  </div>

  <div class="mid">
    <h1>Athena <span class="thin">Docs</span></h1>
    <div class="chips">
      <span class="chip">Desktop</span>
      <span class="chip">Code</span>
      <span class="chip">Loops</span>
      <span class="chip">Whisper</span>
      <span class="chip">Mobile</span>
    </div>
  </div>

  <div class="bottom">
    <span>DOCS.LUCKEYSYSTEMS.COM</span>
    <span class="rule"></span>
    <span>DOCUMENTATION</span>
  </div>
</body>
</html>
